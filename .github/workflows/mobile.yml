name: Mobile build checks
on:
  push:
    paths: ['mobile/**', 'ios/**', 'android/**', 'public/**', 'scripts/build-mobile-demo.mjs', 'src/build-*.mjs', 'capacitor.config.json', '.github/workflows/mobile.yml', 'package-lock.json']
  workflow_dispatch:
# Two variants of each app:
#   live - the app as published: opens the family site (server.url in capacitor.config.json).
#   demo - test build with bundled sample data (scripts/build-mobile-demo.mjs); never contacts the live
#          site, so it is safe for simulators, Appetize and testers without an account.
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [live, demo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build:client
      - if: matrix.variant == 'demo'
        run: node scripts/build-mobile-demo.mjs --write-config
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew :app:assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Saricicek-Android-${{ matrix.variant }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Saricicek-Android-${{ matrix.variant }}
          path: Saricicek-Android-${{ matrix.variant }}.apk

  # Installs the demo APK on an Android emulator, opens it and checks that the app's first screen is
  # drawn (the "Hayat" page text appears in the accessibility tree). Screenshots are kept.
  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Saricicek-Android-demo
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disk-size: 4096M
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          script: |
            adb install -r Saricicek-Android-demo.apk
            adb logcat -c
            adb shell am start -n com.saricicek.family/.MainActivity
            for i in $(seq 1 60); do adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb shell cat /sdcard/ui.xml > ui.xml 2>/dev/null; grep -q 'Hayat' ui.xml && break; sleep 3; done
            adb exec-out screencap -p > android-home.png
            adb logcat -d -t 2000 > logcat.txt || true
            grep -q 'Hayat' ui.xml
            adb shell input keyevent KEYCODE_BACK
            adb exec-out screencap -p > android-after-back.png
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saricicek-Android-emulator-screens
          path: |
            android-*.png
            ui.xml
            logcat.txt

  ios:
    runs-on: macos-latest
    strategy:
      matrix:
        variant: [live, demo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:client
      - if: matrix.variant == 'demo'
        run: node scripts/build-mobile-demo.mjs --write-config
      - run: npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
      # Zipped .app: installable with `xcrun simctl install booted App.app` and accepted by Appetize.
      - run: cd ios-build/Build/Products/Debug-iphonesimulator && ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/Saricicek-iOS-Simulator-${{ matrix.variant }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Saricicek-iOS-Simulator-${{ matrix.variant }}
          path: Saricicek-iOS-Simulator-${{ matrix.variant }}.zip
      # Demo only: boot an iPhone simulator, install and open the app, keep a screenshot.
      - if: matrix.variant == 'demo'
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios-build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.saricicek.family
          sleep 20 # screenshot evidence only; not a pass/fail check
          xcrun simctl io "$DEVICE" screenshot ios-home.png
      - if: matrix.variant == 'demo'
        uses: actions/upload-artifact@v4
        with:
          name: Saricicek-iOS-simulator-screens
          path: ios-home.png

  # Browser simulator links for testers (Appetize). Needs an Appetize account: add its API token as the repository
  # secret APPETIZE_API_TOKEN. Optional repository variables APPETIZE_ANDROID_KEY / APPETIZE_IOS_KEY (printed by
  # the first upload) keep the links the same on later uploads. Only the demo builds are uploaded.
  appetize:
    needs: [android, ios]
    runs-on: ubuntu-latest
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_ANDROID_KEY: ${{ vars.APPETIZE_ANDROID_KEY }}
      APPETIZE_IOS_KEY: ${{ vars.APPETIZE_IOS_KEY }}
    steps:
      - if: env.APPETIZE_API_TOKEN == ''
        run: echo "::notice::Appetize yüklemesi atlandı - APPETIZE_API_TOKEN gizli anahtarı yok (docs/TEST-ENVIRONMENTS.md)."
      - if: env.APPETIZE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.APPETIZE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: env.APPETIZE_API_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          pattern: Saricicek-*-demo
          merge-multiple: true
      - if: env.APPETIZE_API_TOKEN != ''
        run: |
          node scripts/appetize-upload.mjs android Saricicek-Android-demo.apk | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/appetize-upload.mjs ios Saricicek-iOS-Simulator-demo.zip | tee -a "$GITHUB_STEP_SUMMARY"
