name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Real Caddy for tests/caddy.test.mjs (the repository's Caddyfile in front of the server).
      - name: Install Caddy
        run: |
          curl -sSL https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz | tar xz -C "$RUNNER_TEMP" caddy
          echo "CADDY_BIN=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build

  browser:
    # Real browser flows (desktop and phone size) against a throw-away Node server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:client
      - run: npm run test:e2e
        env:
          CI: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    # The production image built from scratch and started the way compose.yaml runs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --no-cache --pull -t saricicek:ci .
      - run: docker image ls saricicek:ci
      - name: Start the image and check it answers
        run: |
          docker run -d --name app -p 3000:3000 -e APP_ORIGIN=http://localhost:3000 -e NODE_ENV=production saricicek:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/health && break; sleep 1; done
          docker exec -e ADMIN_EMAIL=owner@ci.test -e ADMIN_PASSWORD=ci-long-password-2026 -e ADMIN_NAME=CI app node src/admin.mjs
          docker exec app ffmpeg -version | head -1
          curl -fsS http://localhost:3000/api/config | tee config.json
          node -e 'const c=require("./config.json"); if(!c.video?.playbackCopies) { console.error("ffmpeg not found by the app"); process.exit(1) }'
          curl -fsS -c jar -H 'origin: http://localhost:3000' -H 'content-type: application/json' -d '{"email":"owner@ci.test","password":"ci-long-password-2026"}' http://localhost:3000/api/login > /dev/null
          curl -fsS -b jar http://localhost:3000/api/bootstrap > /dev/null
          curl -fsS http://localhost:3000/ | grep -q '<title>'
          docker exec app sh -c 'id -un; ls -ld /app/data'
          echo "Image starts, serves the app, signs in, and has ffmpeg."
      - if: always()
        run: docker logs app || true
