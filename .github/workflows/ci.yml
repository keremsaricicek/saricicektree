name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Real Caddy for tests/caddy.test.mjs (the repository's Caddyfile in front of the server).
      - name: Install Caddy
        run: |
          curl -sSL https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz | tar xz -C "$RUNNER_TEMP" caddy
          echo "CADDY_BIN=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build

  browser:
    # Real browser flows (desktop and phone size) against a throw-away Node server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:client
      - run: npm run test:e2e
        env:
          CI: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    # The production image built from scratch and started with compose.yaml as on a server: app + Caddy
    # (Caddy gives "localhost" a certificate from its own local authority, hence curl -k).
    runs-on: ubuntu-latest
    env:
      SITE_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build --no-cache --pull
      - run: docker image ls
      - run: docker compose up -d
      - name: Check the running stack
        run: |
          for i in $(seq 1 60); do curl -kfsS https://localhost/health && break; sleep 1; done
          docker compose exec -T -e ADMIN_EMAIL=owner@ci.test -e ADMIN_PASSWORD=ci-long-password-2026 -e ADMIN_NAME=CI app node src/admin.mjs
          docker compose exec -T app ffmpeg -version | head -1
          curl -kfsS https://localhost/api/config | tee config.json
          node -e 'const c=require("./config.json"); if(!c.video?.playbackCopies) { console.error("ffmpeg not found by the app"); process.exit(1) }'
          curl -kfsS -c jar -H 'origin: https://localhost' -H 'content-type: application/json' -d '{"email":"owner@ci.test","password":"ci-long-password-2026"}' https://localhost/api/login > /dev/null
          curl -kfsS -b jar https://localhost/api/bootstrap > /dev/null
          curl -kfsS https://localhost/ | grep -q '<title>'
          curl -ksS -o /dev/null -w '%{http_code}\n' http://localhost/ | grep -q 308   # plain HTTP is sent to HTTPS
          docker compose exec -T app sh -c 'id -un; ls -ld /app/data'
          echo "Image builds from scratch, starts behind Caddy with HTTPS, serves the app, signs in, and has ffmpeg."
      - if: always()
        run: docker compose logs --no-color
