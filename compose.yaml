services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      NODE_ENV: production
      DATA_DIR: /app/data
      TRUST_PROXY: "1" # the app is reached only through Caddy
      # Invite and password-reset e-mails (docs/OPERATIONS.md). Empty SMTP_URL turns e-mail off.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Shown on the public privacy, support and account-deletion pages.
      SITE_OPERATOR_NAME: ${SITE_OPERATOR_NAME:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # Full encrypted backups (docs/BACKUP.md). Empty BACKUP_TARGET turns them off.
      BACKUP_TARGET: ${BACKUP_TARGET:-}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_ALERT_URL: ${BACKUP_ALERT_URL:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - family_data:/app/data
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  family_data:
  caddy_data:
  caddy_config:
